<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Ziggurat">
  <title>Ziggurat</title>
  <!-- Base course: preserved evidence -->
  <rect x="2" y="24" width="28" height="6" fill="#8c4a22" />
  <!-- Middle course: staged proposal -->
  <rect x="6" y="16" width="20" height="6" fill="#3b5a6b" />
  <!-- Authorization gap: nothing in the structure bridges it from below -->
  <path d="M6 14h9M17 14h9" stroke="#14171a" stroke-width="1" stroke-linecap="square" />
  <!-- External key crossing the gap from outside the frame -->
  <path d="M31 14h-5" stroke="#14171a" stroke-width="2" stroke-linecap="butt" />
  <circle cx="16" cy="14" r="1.6" fill="none" stroke="#14171a" stroke-width="1" />
  <!-- Upper course: authorized reference data -->
  <rect x="10" y="6" width="12" height="6" fill="#a87516" />
  <!-- Summit aperture: read-only communion -->
  <rect x="14" y="2" width="4" height="2" fill="#14171a" />
</svg>
