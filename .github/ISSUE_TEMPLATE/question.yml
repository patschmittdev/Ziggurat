name: Question
description: Ask about setup, integration, or architecture
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include private vault data, credentials, private keys, or vulnerability details.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include relevant fictional configuration, commands, and expected outcome.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reviewed README.md, SUPPORT.md, and existing issues.
          required: true
        - label: This is not a vulnerability report.
          required: true
