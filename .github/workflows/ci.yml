name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node dist/src/cli/main.js check --root . --audit-clean-room
      - name: Verify real disk-full recovery
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm run test:disk-full:container

  # The documentation site is a standalone project with its own lockfile, so it is
  # installed and validated separately and cannot affect the core runtime package.
  docs:
    name: docs site
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Type checks, produces the production build, then validates the built output
      # for broken internal links, missing heading targets, missing assets, and any
      # root-relative URL that escapes the /Ziggurat/ base path.
      - run: npm run check
